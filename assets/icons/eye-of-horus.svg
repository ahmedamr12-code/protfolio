<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <defs>
    <linearGradient id="eyeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <filter id="eyeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Upper Brow -->
  <path d="M 20 32 C 45 16 115 16 142 32 C 145 34 145 37 142 38 C 112 24 48 24 20 38 C 17 37 17 34 20 32 Z" 
        fill="url(#eyeGold)" filter="url(#eyeGlow)"/>
  <!-- Upper Eyelid -->
  <path d="M 22 52 C 55 35 105 35 138 52 C 105 40 55 40 22 52 Z" 
        stroke="url(#eyeGold)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Lower Eyelid -->
  <path d="M 22 52 C 55 70 105 70 138 52" 
        stroke="url(#eyeGold)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Iris / Pupil -->
  <circle cx="80" cy="52" r="14" fill="url(#eyeGold)" filter="url(#eyeGlow)"/>
  <circle cx="80" cy="52" r="7" fill="#0B132B"/>
  <circle cx="83" cy="49" r="2.5" fill="#FFF"/>
  <!-- Outer Tail Extension -->
  <path d="M 138 52 C 148 50 152 46 156 42" stroke="url(#eyeGold)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Vertical Tear Drop Stem -->
  <path d="M 76 68 L 76 102 C 76 106 79 108 83 108 C 86 108 88 105 88 102 L 88 68 Z" 
        fill="url(#eyeGold)"/>
  <!-- Spiral / Falcon marking curl -->
  <path d="M 92 70 C 105 80 120 88 118 100 C 116 112 100 112 95 102 C 92 96 98 90 104 94 C 108 97 106 102 102 102" 
        stroke="url(#eyeGold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
