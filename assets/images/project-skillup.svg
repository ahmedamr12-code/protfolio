<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1A34"/>
      <stop offset="100%" stop-color="#060C1B"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2B4E"/>
      <stop offset="100%" stop-color="#111C33"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#bg1)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M 50 0 L 50 360 M 150 0 L 150 360 M 250 0 L 250 360 M 350 0 L 350 360 M 450 0 L 450 360 M 550 0 L 550 360" stroke="#1E2E52" stroke-width="1" stroke-dasharray="4 6"/>
  <path d="M 0 60 L 600 60 M 0 120 L 600 120 M 0 180 L 600 180 M 0 240 L 600 240 M 0 300 L 600 300" stroke="#1E2E52" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- Left Card: User A (Data & Python) -->
  <rect x="80" y="80" width="180" height="200" rx="14" fill="url(#cardGrad)" stroke="#2F4370" stroke-width="2"/>
  <circle cx="170" cy="130" r="28" fill="#14213D" stroke="url(#gold1)" stroke-width="2"/>
  <path d="M 160 130 L 166 122 L 174 134 L 180 126" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="110" y="180" width="120" height="10" rx="5" fill="#3A5288"/>
  <rect x="125" y="200" width="90" height="8" rx="4" fill="#253557"/>
  <rect x="105" y="225" width="130" height="28" rx="6" fill="#132447" stroke="#D4AF37" stroke-width="1"/>
  <text x="170" y="244" fill="#FDE68A" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TEACHING: PYTHON</text>

  <!-- Right Card: User B (Design & UI) -->
  <rect x="340" y="80" width="180" height="200" rx="14" fill="url(#cardGrad)" stroke="#2F4370" stroke-width="2"/>
  <circle cx="430" cy="130" r="28" fill="#14213D" stroke="url(#gold1)" stroke-width="2"/>
  <circle cx="430" cy="130" r="14" stroke="#FDE68A" stroke-width="2" fill="none"/>
  <circle cx="430" cy="130" r="5" fill="#D4AF37"/>
  <rect x="370" y="180" width="120" height="10" rx="5" fill="#3A5288"/>
  <rect x="385" y="200" width="90" height="8" rx="4" fill="#253557"/>
  <rect x="365" y="225" width="130" height="28" rx="6" fill="#132447" stroke="#D4AF37" stroke-width="1"/>
  <text x="430" y="244" fill="#FDE68A" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TEACHING: UI/UX</text>

  <!-- Exchange Arrows in Center -->
  <circle cx="300" cy="180" r="34" fill="#0D1B2A" stroke="url(#gold1)" stroke-width="2.5"/>
  <!-- Swap curved arrows -->
  <path d="M 285 168 C 295 158 310 158 318 168" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" fill="none"/>
  <polygon points="320,163 322,172 313,170" fill="#FDE68A"/>
  <path d="M 315 192 C 305 202 290 202 282 192" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" fill="none"/>
  <polygon points="280,197 278,188 287,190" fill="#FDE68A"/>

  <!-- Badge Top -->
  <rect x="220" y="25" width="160" height="30" rx="15" fill="#0B132B" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="300" y="44" fill="#FDE68A" font-family="'Cinzel', serif" font-size="11" font-weight="bold" letter-spacing="2" text-anchor="middle">NON-MONETARY BARTER</text>
</svg>
