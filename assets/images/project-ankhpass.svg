<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="ankhPassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060C1B"/>
    </linearGradient>
    <linearGradient id="ankhPassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#ankhPassBg)"/>

  <!-- Top Badge -->
  <rect x="180" y="20" width="240" height="30" rx="15" fill="#0A1224" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="300" y="39" fill="#FDE68A" font-family="'Cinzel', serif" font-size="11" font-weight="bold" letter-spacing="2" text-anchor="middle">ANKH PASS • TOURISM APP</text>

  <!-- Background Pyramid Silhouettes in Night Sky -->
  <polygon points="120,220 220,110 320,220" fill="#14213D" opacity="0.6"/>
  <polygon points="220,110 320,220 300,220" fill="#0D162B" opacity="0.4"/>
  <polygon points="270,220 340,140 410,220" fill="#1E2E50" opacity="0.5"/>
  
  <!-- Subtle Moon / Sun Glow behind Pyramids -->
  <circle cx="280" cy="110" r="30" fill="#FDE68A" opacity="0.15"/>

  <!-- Center Mobile Phone Mockup -->
  <g transform="translate(215, 65)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="170" height="270" rx="26" fill="#0D1B2A" stroke="url(#ankhPassGold)" stroke-width="3"/>
    <!-- Dynamic Island / Speaker -->
    <rect x="60" y="10" width="50" height="12" rx="6" fill="#050B14"/>
    <circle cx="95" cy="16" r="3" fill="#1E293B"/>

    <!-- App Screen UI -->
    <!-- App Header -->
    <text x="85" y="44" fill="#FDE68A" font-family="'Cinzel', serif" font-size="10" font-weight="bold" text-anchor="middle">ANKH DIGITAL PASS</text>
    
    <!-- Pass Card inside app -->
    <rect x="15" y="55" width="140" height="135" rx="12" fill="#162744" stroke="#D4AF37" stroke-width="1"/>
    
    <!-- Ankh Icon on Pass -->
    <circle cx="85" cy="85" r="16" stroke="url(#ankhPassGold)" stroke-width="2" fill="none"/>
    <line x1="73" y1="101" x2="97" y2="101" stroke="url(#ankhPassGold)" stroke-width="2"/>
    <line x1="85" y1="101" x2="85" y2="115" stroke="url(#ankhPassGold)" stroke-width="2"/>
    
    <text x="85" y="132" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">GIZA VIP EXPEDITION</text>
    <text x="85" y="146" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" text-anchor="middle">Status: Verified & Secure</text>
    
    <!-- QR Code Mini Box -->
    <rect x="65" y="152" width="40" height="30" rx="4" fill="#FFFFFF"/>
    <rect x="70" y="156" width="8" height="8" fill="#000"/>
    <rect x="92" y="156" width="8" height="8" fill="#000"/>
    <rect x="70" y="168" width="8" height="8" fill="#000"/>
    <rect x="83" y="162" width="6" height="6" fill="#000"/>
    <rect x="92" y="170" width="8" height="8" fill="#000"/>

    <!-- Bottom Action Button -->
    <rect x="25" y="200" width="120" height="24" rx="12" fill="url(#ankhPassGold)"/>
    <text x="85" y="216" fill="#0B132B" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">BOOKING & SAFETY</text>
    
    <!-- Safety SOS badge -->
    <rect x="45" y="232" width="80" height="16" rx="8" fill="#10B981" opacity="0.3"/>
    <text x="85" y="244" fill="#34D399" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" text-anchor="middle">🛡️ 24/7 SOS Protection</text>
  </g>

  <!-- Left Feature Tag -->
  <rect x="35" y="150" width="145" height="55" rx="10" fill="#0E1E38" stroke="#2A4373" stroke-width="1.2"/>
  <text x="48" y="172" fill="#FDE68A" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">Smart Scheduling</text>
  <text x="48" y="190" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Dynamic crowd control & queues</text>

  <!-- Right Feature Tag -->
  <rect x="420" y="150" width="145" height="55" rx="10" fill="#0E1E38" stroke="#2A4373" stroke-width="1.2"/>
  <text x="433" y="172" fill="#FDE68A" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold">Tourist Safety Guard</text>
  <text x="433" y="190" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">GPS tracking & live assistance</text>
</svg>
