<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="careerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A162C"/>
      <stop offset="100%" stop-color="#050B16"/>
    </linearGradient>
    <linearGradient id="launchGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="portalGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#careerBg)"/>

  <!-- Top Badge -->
  <rect x="175" y="20" width="250" height="30" rx="15" fill="#060E1D" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="300" y="39" fill="#FDE68A" font-family="'Cinzel', serif" font-size="11" font-weight="bold" letter-spacing="2" text-anchor="middle">CAREERLAUNCH PLATFORM</text>

  <!-- Left: Academic Side (Graduation Cap & Students) -->
  <g transform="translate(80, 110)">
    <circle cx="60" cy="50" r="45" fill="#142342" stroke="#253E6B" stroke-width="2"/>
    <!-- Mortarboard Cap -->
    <polygon points="60,25 95,40 60,55 25,40" fill="#D4AF37"/>
    <rect x="45" y="48" width="30" height="15" rx="3" fill="#B8860B"/>
    <path d="M 85 45 L 95 65" stroke="#FDE68A" stroke-width="2"/>
    <text x="60" y="115" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Egyptian Youth (18-25)</text>
    <text x="60" y="132" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Academic Foundation</text>
  </g>

  <!-- Center Bridge / Transformation Arc -->
  <path d="M 220 160 C 260 110 340 110 380 160" stroke="url(#launchGold)" stroke-width="3" stroke-dasharray="6 4" fill="none"/>
  
  <!-- Center Rocket / Launch Node -->
  <circle cx="300" cy="130" r="30" fill="#0B132B" stroke="url(#launchGold)" stroke-width="2"/>
  <!-- Rocket Icon -->
  <path d="M 300 112 C 308 120 310 135 306 142 L 294 142 C 290 135 292 120 300 112 Z" fill="#38BDF8"/>
  <polygon points="294,136 288,142 294,142" fill="#FDE68A"/>
  <polygon points="306,136 312,142 306,142" fill="#FDE68A"/>
  <polygon points="296,144 300,152 304,144" fill="#EF4444"/>

  <!-- Right: Professional Career Side (Briefcase / Modern Office) -->
  <g transform="translate(380, 110)">
    <circle cx="60" cy="50" r="45" fill="#142342" stroke="url(#launchGold)" stroke-width="2"/>
    <!-- Briefcase -->
    <rect x="36" y="38" width="48" height="34" rx="4" fill="#D4AF37"/>
    <rect x="48" y="28" width="24" height="12" rx="2" fill="none" stroke="#FDE68A" stroke-width="2"/>
    <line x1="36" y1="52" x2="84" y2="52" stroke="#B8860B" stroke-width="1.5"/>
    <circle cx="60" cy="52" r="3" fill="#0B132B"/>
    <text x="60" y="115" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Career Readiness</text>
    <text x="60" y="132" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Industry Integration</text>
  </g>

  <!-- Bottom Metric Cards -->
  <rect x="70" y="275" width="210" height="50" rx="8" fill="#101F3B" stroke="#253E6B" stroke-width="1"/>
  <text x="85" y="295" fill="#FDE68A" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold">TARGET AUDIENCE</text>
  <text x="85" y="312" fill="#CBD5E1" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Egyptian Undergrads & Fresh Grads</text>

  <rect x="320" y="275" width="210" height="50" rx="8" fill="#101F3B" stroke="#253E6B" stroke-width="1"/>
  <text x="335" y="295" fill="#FDE68A" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold">KEY FEATURES</text>
  <text x="335" y="312" fill="#CBD5E1" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Skill Gap Diagnostics, Mentorship & Roadmaps</text>
</svg>
